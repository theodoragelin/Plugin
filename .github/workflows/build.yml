name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dsp-test:
    name: DSP tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run render test
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I Source tests/render_test.cpp -o render_test
          mkdir -p renders && ./render_test renders
      - uses: actions/upload-artifact@v4
        with:
          name: Selene-test-renders
          path: renders/*.wav

  macos:
    name: macOS AU + VST3 (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --target Selene_AU Selene_VST3 Selene_Standalone -- -quiet

      - name: Sign (ad-hoc) and install for validation
        run: |
          ART=build/Selene_artefacts/Release
          for p in "$ART/AU/Selene.component" "$ART/VST3/Selene.vst3" "$ART/Standalone/Selene.app"; do
            codesign --force --deep --sign - "$p"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/Selene.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5

      - name: Validate with auval (same check Logic runs)
        run: auval -strict -v aufx Slne Agln

      - name: Package
        run: |
          ART=build/Selene_artefacts/Release
          mkdir -p dist
          cp -R "$ART/AU/Selene.component" dist/
          cp -R "$ART/VST3/Selene.vst3" dist/
          cp -R "$ART/Standalone/Selene.app" dist/
          cp README.md dist/
          cd dist && ditto -c -k --sequesterRsrc --keepParent . ../Selene-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Selene-macOS
          path: Selene-macOS.zip
